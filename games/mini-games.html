<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeStep Mini Games</title>
<style>
  :root {
    --teal: #0F5E4E; --tealDark: #0B4A3D; --mint: #DCF0EA; --amber: #E39A2D;
    --amberBg: #FDECD2; --red: #B4432F; --green: #2C7A55; --cream: #F8F5EF;
    --ink: #16302B; --muted: #56645F; --line: #E3DDD0; --card: #fff;
    --accent: #0F5E4E; --pageBg: var(--cream); --pageInk: var(--ink); --panel: var(--card);
    --overlay: #F8F5EF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --cream: #101816; --ink: #E8F2EE; --muted: #A9BDB6; --line: #2A3B37; --mint: #17302A; --amberBg: #3A2C16; --card: #1B2926; --accent: #5FC3A8; --overlay: #101816; }
  }
  :root[data-theme="dark"] { --cream: #101816; --ink: #E8F2EE; --muted: #A9BDB6; --line: #2A3B37; --mint: #17302A; --amberBg: #3A2C16; --card: #1B2926; --accent: #5FC3A8; --overlay: #101816; }

  /* Each game gets its own background theme. The picker keeps the base app theme. */
  body.theme-tower {
    --pageBg: radial-gradient(ellipse 120px 40px at 18% 14%, #ffffffcc, transparent 70%),
              radial-gradient(ellipse 160px 52px at 82% 28%, #ffffffb3, transparent 70%),
              radial-gradient(ellipse 90px 30px at 60% 6%, #ffffffaa, transparent 70%),
              linear-gradient(180deg, #5bbde9 0%, #b9e6fb 55%, #eaf8ff 100%);
    --pageInk: #0b3b4f; --panel: #ffffff; --ink: #0b3b4f; --muted: #46687a; --accent: #1b6a8a;
    --line: #bfdde8; --mint: #d6efff; --cream: #eef9ff; --card: #ffffff; --amberBg: #ffe9b8; --overlay: #ffffff;
  }
  body.theme-phone {
    --pageBg: radial-gradient(#ffffff26 1.2px, transparent 1.4px) 0 0 / 22px 22px,
              radial-gradient(circle at 85% 8%, #8f96ff55, transparent 40%),
              linear-gradient(160deg, #1d1b57 0%, #33379a 55%, #5a5fd0 100%);
    --pageInk: #ffffff; --panel: #f2f3ff; --ink: #1c2050; --muted: #545d8c; --accent: #3a3e9e;
    --line: #d4d8f2; --mint: #dfe3ff; --cream: #ebedff; --card: #ffffff; --amberBg: #ffe7bf; --overlay: #f2f3ff;
  }
  body.theme-candy {
    --pageBg: radial-gradient(circle at 15% 20%, #ffffff66 0 7px, transparent 8px) 0 0 / 40px 40px,
              radial-gradient(circle at 70% 75%, #ffffff55 0 5px, transparent 6px) 0 0 / 56px 56px,
              linear-gradient(135deg, #ff8fc7 0%, #ffc66b 50%, #7fe3c8 100%);
    --pageInk: #4a0f3a; --panel: #fff7fb; --ink: #3b0d2c; --muted: #7a3f66; --accent: #c2307a;
    --line: #f3c7e2; --mint: #ffe0f0; --cream: #fff0f8; --card: #ffffff; --amberBg: #fff0c2; --overlay: #fff7fb;
  }

  /* Dark versions of each game's background. Used when the dark theme is on (set by the toggle or the device). */
  html[data-theme="dark"] { color-scheme: dark; }
  html[data-theme="dark"] body.theme-tower {
    --pageBg: radial-gradient(1.2px 1.2px at 20% 18%, #ffffffaa, transparent 2px),
              radial-gradient(1px 1px at 70% 9%, #ffffff88, transparent 2px),
              radial-gradient(1.4px 1.4px at 88% 40%, #ffffff99, transparent 2px),
              linear-gradient(180deg, #071a26 0%, #0f3345 60%, #15465c 100%);
    --pageInk: #d9f2ff; --panel: #132a36; --ink: #e2f4ff; --muted: #9cc3d4; --accent: #5ec8f0;
    --line: #24485a; --mint: #1c3f52; --cream: #0c2030; --card: #163444; --amberBg: #3d3216; --overlay: #0f2430;
  }
  html[data-theme="dark"] body.theme-phone {
    --pageBg: radial-gradient(#ffffff1f 1.2px, transparent 1.4px) 0 0 / 22px 22px,
              radial-gradient(circle at 85% 8%, #6f76ff44, transparent 40%),
              linear-gradient(160deg, #0a0a24 0%, #1a1c52 55%, #2a2e7a 100%);
    --pageInk: #f0f1ff; --panel: #1d1f57; --ink: #eef0ff; --muted: #b3b8e6; --accent: #9aa0ff;
    --line: #3a3e8c; --mint: #2a2e74; --cream: #14164a; --card: #25286b; --amberBg: #4a3a18; --overlay: #181a52;
  }
  html[data-theme="dark"] body.theme-candy {
    --pageBg: radial-gradient(circle at 15% 20%, #ffffff22 0 7px, transparent 8px) 0 0 / 40px 40px,
              radial-gradient(circle at 70% 75%, #ffffff1a 0 5px, transparent 6px) 0 0 / 56px 56px,
              linear-gradient(135deg, #3d0c30 0%, #5c1f3a 50%, #14403e 100%);
    --pageInk: #ffe6f4; --panel: #2c0f27; --ink: #ffe6f4; --muted: #e8a9cd; --accent: #ff6fb0;
    --line: #5a2445; --mint: #4a1a3b; --cream: #300d26; --card: #3a1537; --amberBg: #4d3a12; --overlay: #2c0f27;
  }
  #themeBtn .ico { width: 18px; height: 18px; display: inline-block; vertical-align: -4px; margin-right: 4px; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; background: var(--pageBg); background-attachment: fixed; color: var(--pageInk);
    font-family: Inter, "Noto Sans Devanagari", system-ui, sans-serif; font-size: 18px;
    display: flex; justify-content: center; padding: 16px; transition: background .5s ease;
  }
  .wrap { width: 100%; max-width: 420px; }
  h1 { font-size: 24px; margin: 4px 0 8px; color: var(--pageInk); }
  h2 { font-size: 20px; margin: 0 0 6px; color: var(--accent); }
  .lead { color: var(--muted); margin: 0 0 12px; font-size: 16px; line-height: 1.45; }
  .game {
    margin-bottom: 22px; padding: 18px 16px; border-radius: 22px; background: var(--panel); color: var(--ink);
    box-shadow: 0 10px 28px rgba(0,0,0,.14);
  }
  .game.enter { animation: fadeUp .35s ease-out; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  button {
    font: inherit; font-size: 16px; min-height: 44px; padding: 8px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
    transition: transform .12s ease, box-shadow .2s ease, background .2s ease;
  }
  button:hover:not(:disabled) { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.on { background: var(--mint); border-color: var(--accent); font-weight: 600; }
  button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .lang-row button { background: var(--card); color: var(--ink); }
  .backBtn { margin-bottom: 10px; }

  /* Keyframes */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-6px) scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
  @keyframes stamp { 0% { transform: scale(2.2); opacity: 0; } 60% { transform: scale(.9); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes flashRed { 0% { background: var(--red); } 100% { background: var(--amberBg); } }
  @keyframes glowGreen { 0% { box-shadow: 0 0 0 0 rgba(44,122,85,.6); } 100% { box-shadow: 0 0 0 16px rgba(44,122,85,0); } }
  @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.8); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.05); } 100% { opacity: 0; transform: translate(-50%, -26px) scale(1); } }

  /* Game chooser */
  .picks { display: grid; gap: 12px; }
  .pick {
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    min-height: 120px; padding: 16px; text-align: left; white-space: normal; line-height: 1.35;
    background: var(--card);
  }
  .pick:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
  .pickIcon { font-size: 30px; }
  .pickName { font-size: 18px; font-weight: 700; color: var(--accent); }
  .pickDesc { font-size: 15px; color: var(--muted); }

  /* Shared overlay */
  .overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 24px; background: color-mix(in srgb, var(--overlay) 95%, transparent);
    z-index: 5; border-radius: inherit;
  }
  .overlay.show { display: flex; animation: fadeIn .3s ease-out; }
  .overlay h2 { margin: 0 0 8px; }
  .overlay p { margin: 0 0 14px; line-height: 1.5; }
  .factHead { font-weight: 700; color: var(--amber); margin: 0 0 4px !important; }
  .fact { background: var(--amberBg); border-radius: 12px; padding: 10px 12px; margin: 0 0 14px !important; font-size: 16px; color: var(--ink); }

  .stats { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 8px; font-size: 16px; }
  .hearts { letter-spacing: 3px; display: inline-block; }
  .feedback, .info {
    min-height: 62px; margin-top: 10px; padding: 10px 12px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--line); font-size: 16px; line-height: 1.45; color: var(--ink);
  }
  .feedback.good, .info.good { border-color: var(--green); }
  .feedback.bad, .info.bad { border-color: var(--red); }
  .info { min-height: 74px; margin: 10px 0; }

  /* Game 1: Message Drop Tower */
  .tower {
    position: relative; height: 470px; border-radius: 22px; overflow: hidden;
    background: linear-gradient(180deg, var(--mint), var(--card) 85%);
    border: 1px solid var(--line);
  }
  .lane-bottom {
    position: absolute; left: 0; right: 0; bottom: 0; height: 58px;
    background: var(--amberBg); border-top: 2px dashed var(--amber);
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 0 10px; font-size: 14px; font-weight: 600; color: var(--ink);
  }
  .lane-bottom.flash { animation: flashRed .6s ease-out; }
  .msg {
    position: absolute; left: 10px; right: 10px; top: -120px; padding: 12px 14px;
    border-radius: 14px; background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 3px 8px rgba(0,0,0,.08); cursor: pointer; font-size: 16px; line-height: 1.4; color: var(--ink);
    user-select: none; transition: transform .15s;
  }
  .msg.enter { animation: dropIn .35s ease-out; }
  .msg:hover { transform: scale(1.02); }
  .msg.pop { transform: scale(.6); opacity: 0; transition: transform .25s, opacity .25s; }
  .msg.shake { animation: shake .4s; border-color: var(--red); }
  .msg .tag { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }

  /* Game 2: Build Your Safe Phone */
  .phoneBox { position: relative; }
  .phone {
    background: var(--card); border: 8px solid #1d2b28; border-radius: 30px;
    padding: 14px 12px 16px; max-width: 360px; margin: 0 auto 12px;
  }
  .phone.breach { animation: shake .45s; }
  .phone.blocked { animation: glowGreen .7s ease-out; }
  .phoneTop { display: flex; justify-content: space-between; font-weight: 600; font-size: 15px; margin-bottom: 8px; }
  .meter { display: grid; grid-template-columns: 92px 1fr 40px; gap: 8px; align-items: center; font-size: 14px; margin: 5px 0; }
  .bar { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--green); transition: width .5s ease; }
  .threat {
    margin: 10px 0; padding: 10px 12px; border-radius: 12px; background: var(--amberBg);
    border: 1px solid var(--amber); font-size: 15px; line-height: 1.45; color: var(--ink);
  }
  .threat .head { font-weight: 700; display: block; margin-bottom: 4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile {
    position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
    min-height: 96px; padding: 10px; text-align: left; font-size: 14px; line-height: 1.25;
    white-space: normal; background: var(--cream); color: var(--ink);
  }
  .tile.done { background: var(--mint); border-color: var(--green); }
  .tile.locked { opacity: .65; }
  .tile.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--amber) inset; }
  .ticon { font-size: 22px; }
  .ttitle { font-weight: 600; }
  .tstat { font-size: 13px; color: var(--muted); }
  .tick {
    position: absolute; top: 6px; right: 8px; color: #fff; background: var(--green);
    border-radius: 50%; width: 22px; height: 22px; text-align: center; line-height: 22px; font-size: 13px;
  }
  .tick.stamp { animation: stamp .4s ease-out; }
  .log { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.45; color: var(--muted); }
  .log li { margin-bottom: 4px; }
  .log li.new { animation: fadeUp .4s ease-out; }

  /* Game 3: Safe Match (20 levels, objectives and special tiles) */
  .levelMap { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin: 4px 0 10px; }
  .lvl { min-height: 34px; padding: 0; font-size: 13px; border-radius: 8px; }
  .lvl.done { background: var(--mint); border-color: var(--green); }
  .lvl.cur { background: var(--accent); color: #fff; border-color: var(--accent); }
  .boardBox { position: relative; }
  .board {
    padding: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; touch-action: manipulation;
  }
  .inner { position: relative; width: 100%; aspect-ratio: 1; }
  .tl {
    position: absolute; top: 0; left: 0; display: flex; align-items: center; justify-content: center;
    border-radius: 12px; color: #fff; line-height: 1; cursor: pointer;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), 0 2px 4px rgba(0,0,0,.12);
    transition: transform .3s cubic-bezier(.3,1.3,.6,1);
    will-change: transform;
  }
  .tl:active { filter: brightness(1.08); }
  .tl.sel { outline: 3px solid var(--amber); outline-offset: 1px; }
  .tl.pop { animation: pop .3s ease-in forwards; pointer-events: none; }
  @keyframes pop { 0% { scale: 1; opacity: 1; } 50% { scale: 1.2; } 100% { scale: .1; opacity: 0; } }
  .t0 { background: #0F5E4E; } .t1 { background: #C7811C; } .t2 { background: #3B6E9E; }
  .t3 { background: #2C7A55; } .t4 { background: #B4432F; } .t5 { background: #7A4E9E; }
  .tl.sp {
    background: radial-gradient(circle at 35% 30%, #fff, #ffd166 60%, #f4a261);
    color: #3b1d00; box-shadow: inset 0 0 0 2px #fff, 0 3px 8px rgba(0,0,0,.25);
    animation: spPulse 1.4s ease-in-out infinite;
  }
  @keyframes spPulse { 0%,100% { scale: 1; } 50% { scale: 1.09; } }
  .tl.blk {
    background: repeating-linear-gradient(45deg, #8b8fa3 0 6px, #a4a8bb 6px 12px);
    box-shadow: inset 0 0 0 2px #5d6172; cursor: not-allowed; color: #fff;
  }
  /* Icons: SVG with gradients, shading and small looping animations */
  .ico { width: 100%; height: 100%; overflow: visible; display: block; flex: none;
         filter: drop-shadow(0 2px 2px rgba(0,0,0,.28)); }
  .ico .shk { transform-box: fill-box; transform-origin: 50% 100%; animation: shackle 2.6s ease-in-out infinite; }
  @keyframes shackle { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
  .ico .keyspin { transform-box: fill-box; transform-origin: 30% 50%; animation: keyWobble 2.4s ease-in-out infinite; }
  @keyframes keyWobble { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
  .ico .linkpulse { transform-box: fill-box; transform-origin: center; animation: linkPulse 2s ease-in-out infinite; }
  @keyframes linkPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(.9); } }
  .ico .tickdraw { stroke-dasharray: 30; stroke-dashoffset: 0; animation: tickDraw 2.4s ease-out infinite; }
  @keyframes tickDraw { 0% { stroke-dashoffset: 30; } 40%,100% { stroke-dashoffset: 0; } }
  .ico .ring { transform-box: fill-box; transform-origin: 50% 50%; animation: ringWobble 1.8s ease-in-out infinite; }
  @keyframes ringWobble { 0%,60%,100% { transform: rotate(0); } 68% { transform: rotate(-14deg); } 76% { transform: rotate(14deg); } 84% { transform: rotate(-8deg); } 92% { transform: rotate(6deg); } }
  .ico .spin { transform-box: view-box; transform-origin: 24px 24px; animation: spinIco 3.2s linear infinite; }
  @keyframes spinIco { to { transform: rotate(360deg); } }
  .ico .bob { transform-box: fill-box; transform-origin: center; animation: bobIco 2.2s ease-in-out infinite; }
  @keyframes bobIco { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
  .ico .flicker { transform-box: fill-box; transform-origin: center; animation: flickerIco .9s steps(2, end) infinite; }
  @keyframes flickerIco { 0% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }
  .ico .slide { animation: slideIco 1s ease-in-out infinite; }
  @keyframes slideIco { 0%,100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
  .ico .shimmer { animation: shimmerIco 2s ease-in-out infinite; }
  @keyframes shimmerIco { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .ico .beat { transform-box: fill-box; transform-origin: center; animation: beatIco 1.2s ease-in-out infinite; }
  @keyframes beatIco { 0%,100% { transform: scale(1); } 15% { transform: scale(1.14); } 30% { transform: scale(1); } }
  .ico .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkleIco 2.2s ease-in-out infinite; }
  @keyframes twinkleIco { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.88); opacity: .75; } }
  .ico .pulse { transform-box: fill-box; transform-origin: center; animation: pulseIco 1.8s ease-out infinite; }
  @keyframes pulseIco { 0% { transform: scale(.92); } 60% { transform: scale(1.06); } 100% { transform: scale(.92); } }
  .ico .float { animation: bobIco 2.6s ease-in-out infinite; }

  .pickIcon { display: block; width: 46px; height: 46px; }
  .hearts .ico { width: 19px; height: 19px; display: inline-block; vertical-align: -4px; margin-right: 1px; }
  .hearts .ico.lost { filter: grayscale(1) opacity(.35); animation: none; }
  .ticon { width: 36px; height: 36px; }
  .gi { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
  .gi .ico { width: 26px; height: 26px; }
  .tl .ico { width: 70%; height: 70%; }
  .tag .ico { width: 16px; height: 16px; display: inline-block; vertical-align: -3px; margin-right: 4px; }
  .specials .ico { width: 18px; height: 18px; display: inline-block; vertical-align: -4px; }

  /* Special tile blasts */
  .tl.spawnPop { animation: spawnPop .45s ease-out, spPulse 1.4s ease-in-out .45s infinite; }
  @keyframes spawnPop { 0% { scale: .2; opacity: .2; } 60% { scale: 1.25; opacity: 1; } 100% { scale: 1; } }
  .blast { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
  .bRing {
    position: absolute; border-radius: 50%; border: 6px solid #ffd166;
    box-shadow: 0 0 18px #ff9f1c, inset 0 0 14px #ff9f1c;
    animation: bombRing .6s ease-out forwards;
  }
  @keyframes bombRing { 0% { transform: scale(.2); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
  .bCore {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #ffd166 40%, rgba(255,159,28,0) 70%);
    animation: bombCore .45s ease-out forwards;
  }
  @keyframes bombCore { 0% { transform: scale(.3); opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }
  .bBeam {
    position: absolute; border-radius: 999px;
    background: linear-gradient(90deg, rgba(255,255,255,0), #fff 18%, #ffd166 50%, #fff 82%, rgba(255,255,255,0));
    box-shadow: 0 0 16px #ffd166;
  }
  .bBeam.h { animation: beamH .55s ease-out forwards; transform-origin: left center; }
  .bBeam.v { animation: beamV .55s ease-out forwards; transform-origin: center top; }
  @keyframes beamH { 0% { transform: scaleX(0); opacity: 1; } 55% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
  @keyframes beamV { 0% { transform: scaleY(0); opacity: 1; } 55% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }
  .bRain {
    position: absolute; border-radius: 50%;
    background: conic-gradient(#ff5d5d, #ffd166, #7bdc8a, #5ec8ff, #b98cff, #ff5d5d);
    -webkit-mask: radial-gradient(circle, transparent 55%, #000 62%, #000 74%, transparent 78%);
            mask: radial-gradient(circle, transparent 55%, #000 62%, #000 74%, transparent 78%);
    animation: rainWave .7s ease-out forwards;
  }
  @keyframes rainWave { 0% { transform: scale(.15); opacity: 1; } 100% { transform: scale(1.05); opacity: 0; } }
  .combo {
    position: absolute; left: 50%; top: 40%; z-index: 4; pointer-events: none;
    font-weight: 800; font-size: 22px; color: var(--amber); text-shadow: 0 2px 0 rgba(0,0,0,.25);
    animation: floatUp 1s ease-out forwards;
  }
  .objective { display: grid; grid-template-columns: 28px 1fr 64px; align-items: center; gap: 8px; font-size: 14px; margin: 6px 0; }
  .objective .gi { font-size: 18px; text-align: center; }
  .objective.done .lbl { color: var(--green); font-weight: 700; }
  .specials { margin-top: 10px; font-size: 14px; color: var(--muted); }
  .specials summary { cursor: pointer; font-weight: 600; color: var(--accent); }

// Renders one icon as inline SVG markup.
function svgIcon(name, cls = "") {
  return `<svg class="ico ic-${name} ${cls}" viewBox="0 0 48 48" aria-hidden="true" focusable="false">${SVG_PARTS[name] || ""}</svg>`;
}

// Replaces the emoji used in text strings with the matching SVG icon.
function iconize(str) {
  const map = { "💥": "bomb", "➡️": "lineH", "⬇️": "lineV", "🌈": "rain", "🔐": "padlock" };
  let out = str;
  Object.entries(map).forEach(([emoji, name]) => { out = out.split(emoji).join(svgIcon(name)); });
  return out;
}

/* ---------- Dark / light theme: saved per browser, starts from the device setting ---------- */
const THEME_KEY = "safestep-theme-v1";
const THEME_NAME = {
  en: { dark: "Dark", light: "Light" },
  hi: { dark: "डार्क", light: "लाइट" },
  mr: { dark: "डार्क", light: "लाइट" },
};
function savedTheme() { try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; } }
function saveTheme(t) { try { localStorage.setItem(THEME_KEY, t); } catch (e) { /* private window: keep going */ } }
function isDark() { return document.documentElement.dataset.theme === "dark"; }
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.documentElement.style.colorScheme = t;
  updateThemeBtn();
}
// The button offers the other mode: sun in dark mode (switch to light), moon in light mode.
function updateThemeBtn() {
  const btn = document.getElementById("themeBtn");
  if (!btn) return;
  const dark = isDark();
  btn.innerHTML = svgIcon(dark ? "sun" : "moon") + " " + THEME_NAME[lang][dark ? "light" : "dark"];
}
function initTheme() {
  const sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  setTheme(savedTheme() || (sysDark ? "dark" : "light"));
  document.getElementById("themeBtn").addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    saveTheme(next);
    setTheme(next);
  });
}

const TOTAL = 12;            // messages per tower game

let score = 0, lives = 3, spawned = 0, caught = 0, scamsTotal = 0;
let pickQueue = [];

function shuffledDeck() {
  const arr = DECK.slice();
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr.slice(0, TOTAL);
}

function feedback(text, kind) {
  const f = $("feedback");
  f.textContent = text;
  f.className = "feedback " + (kind || "");
  f.animate([{ opacity: 0.2, transform: "translateY(4px)" }, { opacity: 1, transform: "none" }], { duration: 260, easing: "ease-out" });
}

function updateStats(bump) {
  $("scoreLbl").textContent = `${UI[lang].score}: ${score}`;
  $("hearts").innerHTML = [0, 1, 2].map(i => svgIcon("heart", i < lives ? "" : "lost")).join("");
  if (bump) $("scoreLbl").animate([{ transform: "scale(1.25)" }, { transform: "scale(1)" }], { duration: 300 });
}

  if (!pickQueue.length) return;

  const tag = document.createElement("span");
  tag.className = "tag";
  tag.innerHTML = svgIcon("envelope") + " " + UI[lang].safeTag;
  const body = document.createElement("span");
  body.textContent = m.t[lang];
  el.append(tag, body);
  $("tower").appendChild(el);
  const item = { el, m, y: -120, dead: false };
  el.addEventListener("pointerdown", e => { e.preventDefault(); tapItem(item); });
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tapItem(item); } });
  items.push(item);
  spawned++;
}

function removeItem(item, pop) {
  item.dead = true;
  if (pop) {
    item.el.classList.add("pop");
    setTimeout(() => item.el.remove(), 260);
  } else {
    item.el.remove();
  }
  items = items.filter(i => i !== item);
}

function tapItem(item) {
  if (item.dead || state !== "playing") return;
  const u = UI[lang];
  if (item.m.scam) {
    caught++;
    score += 10;
    removeItem(item, true);
    feedback(u.caught + item.m.why[lang], "good");
    updateStats(true);
  } else {
    score = Math.max(0, score - 5);
    lives--;
    item.el.classList.add("shake");
    feedback(u.safeTap, "bad");
    updateStats(false);
    setTimeout(() => removeItem(item, false), 400);
  }
  checkEnd();
}

function checkEnd() {
  if (lives <= 0) return finish("over");
  if (spawned >= TOTAL && items.length === 0) return finish("won");
}

function finish(kind) {
  state = kind;
  cancelAnimationFrame(rafId);
  const u = UI[lang];
  const ov = $("overlay");
  ov.querySelector("h2").textContent = kind === "won" ? u.winTitle : u.overTitle;
  $("ovText").textContent = u.result(caught, scamsTotal) + " " + u.tip;
  $("startBtn").textContent = u.againBtn;
  ov.classList.add("show");
  $("pauseBtn").disabled = true;
}

function loop(ts) {
  if (state !== "playing") return;
  if (lastTs == null) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;

  if (spawned < TOTAL && ts - lastSpawn >= SPAWN_MS) {
    spawn();
    lastSpawn = ts;
  }
  const v = SPEEDS[speed];
  const floor = $("tower").clientHeight - 58; // top of the bottom lane
  for (const item of items.slice()) {
    if (item.dead) continue;
    item.y += v * dt;
    item.el.style.top = item.y + "px";
    if (item.y + item.el.offsetHeight >= floor) {
      item.dead = true;
      if (item.m.scam) {
        lives--;
        feedback(UI[lang].missedPre + item.m.why[lang], "bad");
        const lane = $("laneBottom");
        lane.classList.remove("flash"); void lane.offsetWidth; lane.classList.add("flash");
        updateStats(false);
        item.el.style.transition = "opacity .3s";
        item.el.style.opacity = "0";
        setTimeout(() => item.el.remove(), 320);
      } else {
        item.el.remove();
      }
      items = items.filter(i => i !== item);
      checkEnd();
      if (state !== "playing") return;
    }
  }
  rafId = requestAnimationFrame(loop);
}

function startGame() {
  cancelAnimationFrame(rafId);
  $("tower").querySelectorAll(".msg").forEach(n => n.remove());
  items = []; score = 0; lives = 3; spawned = 0; caught = 0;
  pickQueue = shuffledDeck();
  scamsTotal = pickQueue.filter(m => m.scam).length;
  state = "playing";
  lastTs = null;
  lastSpawn = performance.now() - SPAWN_MS; // first drop right away
  $("overlay").classList.remove("show");
  $("pauseBtn").disabled = false;
  $("pauseBtn").textContent = UI[lang].pause;
  feedback("", "");
  updateStats(false);
  rafId = requestAnimationFrame(loop);
}

function togglePause() {
  if (state === "playing") {
    state = "paused";
    cancelAnimationFrame(rafId);
    $("pauseBtn").textContent = UI[lang].resume;
  } else if (state === "paused") {
    state = "playing";
    lastTs = null;
    lastSpawn = performance.now() - (SPAWN_MS / 2);
    $("pauseBtn").textContent = UI[lang].pause;
    rafId = requestAnimationFrame(loop);
  }
}

function showStart() {
  const u = UI[lang];
  state = "ready";
  $("overlay").querySelector("h2").textContent = u.startTitle;
  $("ovText").textContent = u.startText;
  $("startBtn").textContent = u.startBtn;
  $("overlay").classList.add("show");
}

const PHONE_KEY = "safestep-phone-v2";
let P = loadPhone();
let selected = null;
let justDone = null;   // defence just set up (for the stamp animation)
let justLog = false;   // a new day just resolved (for log/threat animation)

function freshPhone() {
  const order = THREATS.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  return { order, day: 1, points: 3, done: [], log: [], ended: false };
}

function loadPhone() {
  try {
    const v = JSON.parse(localStorage.getItem(PHONE_KEY));
    const ok = v && Array.isArray(v.order) && v.order.length === THREATS.length
      && Number.isInteger(v.day) && v.day >= 1 && v.day <= DAYS + 1
      && Number.isInteger(v.points) && v.points >= 0
      && Array.isArray(v.done) && v.done.every(n => Number.isInteger(n) && n >= 0 && n < HABIT_META.length)
      && Array.isArray(v.log) && typeof v.ended === "boolean";
    if (ok) return v;
  } catch (e) { /* unreadable saved data: start fresh */ }
  return freshPhone();
}

function savePhone() {
  try { localStorage.setItem(PHONE_KEY, JSON.stringify(P)); } catch (e) { /* storage blocked: game still works */ }
}

function reqMet(i) {
  const r = HABIT_META[i].req;
  return r === null || P.done.includes(r);
}

function setInfo(text, kind) {

function buyHabit() {
  if (selected === null || P.ended) return;
  const u = UI[lang];

function faceThreat() {
  if (P.ended) return;

/* ---------- Game 3: Safe Match (20 levels, objectives, special tiles) ---------- */
// Tile types: 0-5 are safety habits (index into CANDY.types), plus special and blocked tiles.
const CANDY = {
  size: 7,
  levels: 20,
  types: [
    { icon: "lock", habit: 0 }, { icon: "key", habit: 1 }, { icon: "link", habit: 2 },
    { icon: "check", habit: 3 }, { icon: "phone", habit: 6 }, { icon: "refresh", habit: 5 },
  ],
};
const BLOCK = -2, EMPTY = -1;
const SP_BOMB = 10, SP_LINE_H = 11, SP_LINE_V = 12, SP_RAIN = 13;
const SP_ICON = { 10: "bomb", 11: "lineH", 12: "lineV", 13: "rain" };
const isNormal = v => v >= 0 && v <= 5;
const isSpecial = v => v >= 10;

// Levels get harder: more tile types, higher targets, locked tiles and score goals later, fewer moves.
function levelCfg(L) {
  const k = L <= 4 ? 4 : L <= 11 ? 5 : 6;
  const A = (L - 1) % k, B = (A + 2) % k;
  const ct = 8 + Math.floor((L - 1) / 2);
  const obj = [
    { kind: "collect", type: A, target: ct },
    { kind: "collect", type: B, target: ct },
  ];
  let blockers = 0;
  if ((L >= 5 && L <= 9) || L >= 15) {
    const bt = 3 + Math.floor(L / 5);
    obj.push({ kind: "blockers", target: bt });
    blockers = bt + 2;
  }
  if (L >= 10) obj.push({ kind: "score", target: 400 + 40 * (L - 10) });
  return { k, obj, blockers, moves: Math.max(16, 24 - Math.floor((L - 1) / 2)) };
}

const CANDY_KEY = "safestep-candy-v1";
let candyUnlocked = loadUnlocked();
let CG = null;   // current level state
let candyOvAction = null;

function loadUnlocked() {
  try {
    const v = JSON.parse(localStorage.getItem(CANDY_KEY));
    if (v && Number.isInteger(v.unlocked) && v.unlocked >= 1 && v.unlocked <= CANDY.levels) return v.unlocked;
  } catch (e) { /* start at level 1 */ }
  return 1;
}

function saveUnlocked() {
  try { localStorage.setItem(CANDY_KEY, JSON.stringify({ unlocked: candyUnlocked })); } catch (e) { /* storage blocked */ }
}

const randType = k => Math.floor(Math.random() * k);
const keyOf = (r, c) => r + "," + c;
const parseKey = k => k.split(",").map(Number);

// Finds straight runs of 3+ equal normal tiles.
function findRuns(g) {
  const N = g.length, runs = [];
  for (let r = 0; r < N; r++) {
    let c = 0;
    while (c < N) {
      const v = g[r][c];
      if (!isNormal(v)) { c++; continue; }
      let e = c + 1;
      while (e < N && g[r][e] === v) e++;
      if (e - c >= 3) runs.push({ dir: "h", cells: Array.from({ length: e - c }, (_, i) => [r, c + i]) });
      c = e;
    }
  }
  for (let c = 0; c < N; c++) {
    let r = 0;
    while (r < N) {
      const v = g[r][c];
      if (!isNormal(v)) { r++; continue; }
      let e = r + 1;
      while (e < N && g[e][c] === v) e++;
      if (e - r >= 3) runs.push({ dir: "v", cells: Array.from({ length: e - r }, (_, i) => [r + i, c]) });
      r = e;
    }
  }
  return runs;
}

// Decides what a set of runs clears, and which special tiles it creates.
function matchPlan(g) {
  const runs = findRuns(g);
  const clear = new Set();
  const spawns = new Map();
  runs.forEach(run => run.cells.forEach(([r, c]) => clear.add(keyOf(r, c))));
  // Bomb: an L or T shape, where a horizontal and a vertical run cross
  const hCells = new Set(), vCells = new Set();
  runs.forEach(run => run.cells.forEach(([r, c]) => (run.dir === "h" ? hCells : vCells).add(keyOf(r, c))));
  hCells.forEach(k => { if (vCells.has(k)) spawns.set(k, SP_BOMB); });
  runs.forEach(run => {
    const n = run.cells.length;
    if (n >= 5) {
      const [r, c] = run.cells[Math.floor(n / 2)];
      const k = keyOf(r, c);
      if (!spawns.has(k)) spawns.set(k, SP_RAIN);
    } else if (n === 4) {
      const [r, c] = run.cells[1];
      const k = keyOf(r, c);
      if (!spawns.has(k)) spawns.set(k, run.dir === "h" ? SP_LINE_H : SP_LINE_V);
    }
  });
  spawns.forEach((_, k) => clear.delete(k));
  return { clear, spawns };
}

function swapIn(g, a, b) {
  const t = g[a[0]][a[1]]; g[a[0]][a[1]] = g[b[0]][b[1]]; g[b[0]][b[1]] = t;
}

// A move is possible if a swap makes a run, or involves a special tile.
function hasMove(g) {
  const N = g.length;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const nr = r + dr, nc = c + dc;
      if (nr >= N || nc >= N) continue;
      const a = g[r][c], b = g[nr][nc];
      if (a === BLOCK || b === BLOCK) continue;
      if (isSpecial(a) || isSpecial(b)) return true;
      swapIn(g, [r, c], [nr, nc]);
      const ok = findRuns(g).length > 0;
      swapIn(g, [r, c], [nr, nc]);
      if (ok) return true;
    }
  }
  return false;
}

function newBoard(k, nBlockers) {
  const N = CANDY.size;
  let t;
  do {
    t = Array.from({ length: N }, () => Array.from({ length: N }, () => randType(k)));
    // Place locked tiles away from the top row so the first moves are possible.
    let placed = 0, guard = 0;
    while (placed < nBlockers && guard++ < 500) {
      const r = 1 + Math.floor(Math.random() * (N - 1)), c = Math.floor(Math.random() * N);
      if (t[r][c] !== BLOCK) { t[r][c] = BLOCK; placed++; }
    }
  } while (findRuns(t).length > 0 || !hasMove(t));
  return t;
}

function startLevel(L) {
  const cfg = levelCfg(L);
  const N = CANDY.size;
  const t = newBoard(cfg.k, cfg.blockers);
  const id = Array.from({ length: N }, (_, r) => Array.from({ length: N }, (_, c) => r * N + c));
  CG = {
    level: L, cfg, t, id, nextId: N * N,
    obj: cfg.obj.map(o => ({ ...o, cur: 0 })),
    moves: cfg.moves, score: 0,
    busy: false, sel: null, over: false, els: new Map(),
  };
  $("cgInner").innerHTML = "";
  hideCandyOv();
  placeTiles();
  setCandyInfo(UI[lang].candyHint);
  renderCandyPanel();
}

function tileClass(v) {
  if (v === BLOCK) return "tl blk";
  if (isSpecial(v)) return "tl sp";
  return "tl t" + v;
}
function tileIcon(v) {
  if (v === BLOCK) return svgIcon("padlock");
  if (isSpecial(v)) return svgIcon(SP_ICON[v]);
  return svgIcon(CANDY.types[v].icon);
}

// Positions every tile. New tiles start above the board so they fall in.
function placeTiles() {
  const inner = $("cgInner");
  const N = CANDY.size;
  const cell = inner.clientWidth / N;
  const size = cell - 6;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const idv = CG.id[r][c];
    if (idv < 0) continue;
    let el = CG.els.get(idv);
    if (el && el.classList.contains("pop")) continue;
    if (!el) {
      el = document.createElement("div");
      el.style.transform = `translate(${c * cell + 3}px, ${-cell}px)`;
      inner.append(el);
      CG.els.set(idv, el);
      void el.offsetWidth; // flush so the fall animates from above
    }
    const v = CG.t[r][c];
    const selected = !!CG.sel && CG.sel[0] === r && CG.sel[1] === c;
    el.className = tileClass(v) + (selected ? " sel" : "");
    el.innerHTML = tileIcon(v);
    el.style.width = el.style.height = size + "px";
    el.style.fontSize = (cell * 0.5) + "px";
    el.dataset.r = r;
    el.dataset.c = c;
    el.style.transform = `translate(${c * cell + 3}px, ${r * cell + 3}px)`;
  }
}

function applyGravity() {
  const N = CANDY.size, k = CG.cfg.k;
  for (let c = 0; c < N; c++) {
    let write = N - 1;
    for (let r = N - 1; r >= 0; r--) {
      if (CG.t[r][c] !== EMPTY) {
        CG.t[write][c] = CG.t[r][c];
        CG.id[write][c] = CG.id[r][c];
        write--;
      }
    }
    for (let r = write; r >= 0; r--) {
      CG.t[r][c] = randType(k);
      CG.id[r][c] = CG.nextId++;
    }
  }
}

function progressOf(o) {
  return o.kind === "score" ? CG.score : o.cur;
}

function renderCandyPanel() {
  const u = UI[lang];
  $("cgLevel").textContent = u.candyLevel(CG.level);
  $("cgMoves").textContent = `${u.movesLbl}: ${CG.moves}`;
  $("cgRestart").textContent = u.restartLevel;

  // Level map: done, current, and locked levels
  const map = $("cgMap");
  map.innerHTML = "";
  for (let L = 1; L <= CANDY.levels; L++) {
    const b = document.createElement("button");
    b.className = "lvl" + (L < candyUnlocked && L !== CG.level ? " done" : "") + (L === CG.level ? " cur" : "");
    b.textContent = L;
    b.disabled = L > candyUnlocked;
    b.setAttribute("aria-label", u.candyLevel(L));
    b.addEventListener("click", () => startLevel(L));
    map.append(b);
  }

  // Objectives for this level
  const box = $("cgGoals");
  box.innerHTML = "";
  CG.obj.forEach(o => {
    const target = o.target;
    const cur = Math.min(progressOf(o), target);
    const done = cur >= target;
    let icon, label;
    if (o.kind === "collect") {
      icon = svgIcon(CANDY.types[o.type].icon);
      label = u.objCollect(target, u.habits[CANDY.types[o.type].habit].t);
    } else if (o.kind === "blockers") {
      icon = svgIcon("padlock");
      label = u.objBlockers(target);
    } else {
      icon = svgIcon("star");
      label = u.objScore(target);
    }
    const row = document.createElement("div");
    row.className = "objective" + (done ? " done" : "");
    const ic = document.createElement("span"); ic.className = "gi"; ic.innerHTML = icon;
    const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = label + (done ? " ✓" : "");
    const bar = document.createElement("div"); bar.className = "bar";
    const fill = document.createElement("span"); fill.style.width = (cur / target * 100) + "%";
    bar.append(fill);
    const num = document.createElement("span"); num.textContent = `${cur}/${target}`;
    row.append(ic, lbl, bar, num);
    box.append(row);
  });
  const note = document.createElement("p");
  note.style.cssText = "font-size:13px;color:var(--muted);margin:6px 0 0;";
  note.textContent = u.lockNote;
  box.append(note);
}

function setCandyInfo(text, kind) {
  const el = $("cgInfo");
  el.textContent = text;
  el.className = "info " + (kind || "");
}

function showComboPopup(n) {
  const p = document.createElement("div");
  p.className = "combo";
  p.textContent = `${UI[lang].combo}×${n}`;
  $("cgInner").append(p);
  setTimeout(() => p.remove(), 1000);
}

function showCandyOv(title, text, btnText, action, withFact) {
  $("cgOvTitle").textContent = title;
  $("cgFactHead").textContent = withFact ? UI[lang].factHead : "";
  $("cgFactHead").hidden = !withFact;
  $("cgFact").textContent = withFact ? FACTS[lang][CG.level - 1] : "";
  $("cgFact").hidden = !withFact;
  $("cgOvText").textContent = text || "";
  $("cgOvBtn").textContent = btnText;
  candyOvAction = action;
  $("cgOv").classList.add("show");
}

function hideCandyOv() {
  $("cgOv").classList.remove("show");
  candyOvAction = null;
}

// Plays the visual blast for an activated special tile at (r, c).
function playBlast(kind, r, c) {
  const inner = $("cgInner");
  const N = CANDY.size;
  const cell = inner.clientWidth / N;
  const cx = c * cell + cell / 2, cy = r * cell + cell / 2;
  const layer = document.createElement("div");
  layer.className = "blast";
  inner.append(layer);

  const place = (el, x, y, w, h) => {
    el.style.left = x + "px"; el.style.top = y + "px";
    el.style.width = w + "px"; el.style.height = h + "px";
    layer.append(el);
    return el;
  };

  if (kind === SP_BOMB) {
    // Shockwave ring over the 3x3 area, a bright core, and a shake of the board
    const span = cell * 3;
    place(document.createElement("div"), cx - span / 2, cy - span / 2, span, span).className = "bRing";
    place(document.createElement("div"), cx - cell * 0.9, cy - cell * 0.9, cell * 1.8, cell * 1.8).className = "bCore";
    inner.animate([
      { transform: "translate(0,0)" }, { transform: "translate(-4px,3px)" },
      { transform: "translate(4px,-3px)" }, { transform: "translate(0,0)" },
    ], { duration: 320 });
  } else if (kind === SP_LINE_H) {
    // A beam sweeps across the whole row
    const h = cell * 0.7;
    place(document.createElement("div"), 0, cy - h / 2, N * cell, h).className = "bBeam h";
    inner.animate([{ transform: "translateY(0)" }, { transform: "translateY(-3px)" }, { transform: "translateY(0)" }], { duration: 240 });
  } else if (kind === SP_LINE_V) {
    // A beam sweeps down the whole column
    const w = cell * 0.7;
    place(document.createElement("div"), cx - w / 2, 0, w, N * cell).className = "bBeam v";
    inner.animate([{ transform: "translateX(0)" }, { transform: "translateX(-3px)" }, { transform: "translateX(0)" }], { duration: 240 });
  } else if (kind === SP_RAIN) {
    // A rainbow wave spreads out from the tile
    const span = cell * 6;
    place(document.createElement("div"), cx - span / 2, cy - span / 2, span, span).className = "bRain";
  }
  setTimeout(() => layer.remove(), 800);
}

// Clears the given cells: counts objectives and score, pops the tiles, places new specials,
// then lets the tiles fall and refill. Blasts play for special tiles that were activated.
async function resolveStep(clearSet, spawns, combo, msgKey, blasts = []) {
  const u = UI[lang];
  const clear = new Set(clearSet);
  // Locked tiles next to a cleared tile are unlocked (cleared) too
  clearSet.forEach(k => {
    const [r, c] = parseKey(k);
    [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].forEach(([nr, nc]) => {
      if (nr >= 0 && nc >= 0 && nr < CANDY.size && nc < CANDY.size && CG.t[nr][nc] === BLOCK) clear.add(keyOf(nr, nc));
    });
  });

  let gained = 0;
  let firstHabit = null;
  clear.forEach(k => {
    const [r, c] = parseKey(k);
    const v = CG.t[r][c];
    if (isNormal(v)) {
      gained += 10;
      if (firstHabit === null) firstHabit = v;
      CG.obj.forEach(o => { if (o.kind === "collect" && o.type === v) o.cur++; });
    } else if (v === BLOCK) {
      gained += 20;
      CG.obj.forEach(o => { if (o.kind === "blockers") o.cur++; });
    } else if (isSpecial(v)) {
      gained += 30;
    }
  });
  spawns.forEach((ty, k) => { gained += 30; });
  CG.score += gained;

  // Create special tiles in place (they keep their id and do not fall)
  spawns.forEach((ty, k) => {
    const [r, c] = parseKey(k);
    CG.t[r][c] = ty;
    const el = CG.els.get(CG.id[r][c]);
    if (el) { el.className = tileClass(ty) + " spawnPop"; el.innerHTML = tileIcon(ty); }
  });

  // Blast effects, then pop the cleared tiles in a ripple that spreads from the blast origin
  blasts.forEach(b => playBlast(b.kind, b.r, b.c));
  const origin = blasts.length ? blasts[0] : null;
  clear.forEach(k => {
    const [r, c] = parseKey(k);
    const idv = CG.id[r][c];
    const el = CG.els.get(idv);
    if (el) {
      const dist = origin ? Math.abs(r - origin.r) + Math.abs(c - origin.c) : 0;
      const delay = dist * 0.04;
      el.style.animationDelay = delay + "s";
      el.classList.add("pop");
      CG.els.delete(idv);
      setTimeout(() => el.remove(), 320 + delay * 1000);
    }
  });

  if (combo > 1) showComboPopup(combo);
  if (msgKey === "special") setCandyInfo((combo > 1 ? u.combo : "") + u.specialMsg, "good");
  else if (firstHabit !== null) {
    const h = u.habits[CANDY.types[firstHabit].habit];
    setCandyInfo((combo > 1 ? u.combo : "") + `${h.t}: ${h.why}`, "good");
  } else {
    setCandyInfo((combo > 1 ? u.combo : "") + u.unlockMsg, "good");
  }
  renderCandyPanel();
  await sleep(300);

  clear.forEach(k => { const [r, c] = parseKey(k); CG.t[r][c] = EMPTY; CG.id[r][c] = -1; });
  applyGravity();
  placeTiles();
  renderCandyPanel();
  await sleep(380);
}

// Runs cascades until the board settles.
async function cascade() {
  let combo = 1;
  while (true) {
    const plan = matchPlan(CG.t);
    if (!plan.clear.size && !plan.spawns.size) break;
    if (combo > 1) await sleep(120);
    await resolveStep(plan.clear, plan.spawns, combo, "match");
    combo++;
  }
}

// Special tile activation: returns the cells it clears.
function activationCells(pos, sp, other) {
  const N = CANDY.size;
  const [r, c] = pos;
  const out = new Set([keyOf(r, c)]);
  if (sp === SP_BOMB) {
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nc >= 0 && nr < N && nc < N) out.add(keyOf(nr, nc));
    }
  } else if (sp === SP_LINE_H) {
    for (let cc = 0; cc < N; cc++) out.add(keyOf(r, cc));
  } else if (sp === SP_LINE_V) {
    for (let rr = 0; rr < N; rr++) out.add(keyOf(rr, c));
  } else if (sp === SP_RAIN) {
    if (isNormal(other)) {
      for (let rr = 0; rr < N; rr++) for (let cc = 0; cc < N; cc++) if (CG.t[rr][cc] === other) out.add(keyOf(rr, cc));
    }
  }
  // Locked tiles are only cleared by neighbours, never directly
  [...out].forEach(k => { const [rr, cc] = parseKey(k); if (CG.t[rr][cc] === BLOCK) out.delete(k); });
  return out;
}

async function attemptSwap(a, b) {
  const u = UI[lang];
  const va = CG.t[a[0]][a[1]], vb = CG.t[b[0]][b[1]];
  if (va === BLOCK || vb === BLOCK) {
    setCandyInfo(u.lockedTile, "bad");
    return;
  }
  CG.busy = true;
  swapIn(CG.t, a, b);
  swapIn(CG.id, a, b);
  placeTiles();

  const spA = isSpecial(va), spB = isSpecial(vb);
  if (spA || spB) {
    // The special tile moved to the other cell. Activate it there.
    const spPos = spA ? b : a;
    const sp = spA ? va : vb;
    const other = spA ? vb : va;
    CG.moves--;
    renderCandyPanel();
    await sleep(200);
    const clear = activationCells(spPos, sp, other);
    await resolveStep(clear, new Map(), 1, "special", [{ kind: sp, r: spPos[0], c: spPos[1] }]);
    await cascade();
  } else {
    const plan = matchPlan(CG.t);
    if (!plan.clear.size && !plan.spawns.size) {
      await sleep(320);
      swapIn(CG.t, a, b);
      swapIn(CG.id, a, b);
      placeTiles();
      const inner = $("cgInner");
      inner.animate([{ transform: "translateX(0)" }, { transform: "translateX(-5px)" }, { transform: "translateX(5px)" }, { transform: "translateX(0)" }], { duration: 300 });
      setCandyInfo(u.noMatch, "bad");
      CG.busy = false;
      return;
    }
    CG.moves--;
    renderCandyPanel();
    await sleep(200);
    await resolveStep(plan.clear, plan.spawns, 1, "match");
    await cascade();
  }
  CG.busy = false;
  checkLevelEnd();
  renderCandyPanel();
}

function checkLevelEnd() {
  const u = UI[lang];
  const won = CG.obj.every(o => progressOf(o) >= o.target);
  if (won) {
    CG.over = true;
    const L = CG.level;
    if (L + 1 > candyUnlocked) { candyUnlocked = Math.min(CANDY.levels, L + 1); saveUnlocked(); }
    if (L < CANDY.levels) {
      showCandyOv(u.levelDone(L), "", u.nextLevel, () => startLevel(L + 1), true);
    } else {
      showCandyOv(u.finalTitle, u.finalText, u.playAgain, () => startLevel(1), true);
    }
  } else if (CG.moves <= 0) {
    CG.over = true;
    showCandyOv(u.loseTitle, u.loseText, u.restartLevel, () => startLevel(CG.level), false);
  }
}

function onCandyTap(r, c) {
  if (!CG || CG.busy || CG.over) return;
  if (!CG.sel) { CG.sel = [r, c]; placeTiles(); return; }
  const [sr, sc] = CG.sel;
  if (sr === r && sc === c) { CG.sel = null; placeTiles(); return; }
  if (Math.abs(sr - r) + Math.abs(sc - c) !== 1) { CG.sel = [r, c]; placeTiles(); return; }
  CG.sel = null;
  attemptSwap([sr, sc], [r, c]);
}

$("cgBoard").addEventListener("click", e => {
  const el = e.target.closest(".tl");
  if (!el || !CG) return;
  onCandyTap(Number(el.dataset.r), Number(el.dataset.c));
});
$("cgOvBtn").addEventListener("click", () => { if (candyOvAction) candyOvAction(); });
$("cgRestart").addEventListener("click", () => { if (CG) startLevel(CG.level); });
$("pickCandyBtn").addEventListener("click", () => showGame("candy"));
$("backFromCandy").addEventListener("click", () => showGame("picker"));
window.addEventListener("resize", () => { if (CG) placeTiles(); });

/* ---------- Game chooser ---------- */
function showGame(which) {
  // Leaving the tower mid-game pauses it, so nothing runs in the background.
  if (which !== "tower" && state === "playing") togglePause();
  const sections = { picker: "picker", tower: "towerGame", phone: "phoneGame", candy: "candyGame" };
  Object.entries(sections).forEach(([key, id]) => {
    const el = $(id);
    const show = key === which;
    if (show && el.hidden) {
      el.hidden = false;
      el.classList.remove("enter");
      void el.offsetWidth;
      el.classList.add("enter");
    } else {
      el.hidden = !show;
    }
  });
  document.body.className = "theme-" + which;
  if (which === "candy" && !CG) startLevel(candyUnlocked);
  window.scrollTo({ top: 0 });
}
$("pickTowerBtn").addEventListener("click", () => showGame("tower"));
$("pickPhoneBtn").addEventListener("click", () => showGame("phone"));
$("backFromTower").addEventListener("click", () => showGame("picker"));
$("backFromPhone").addEventListener("click", () => showGame("picker"));

/* ---------- Shared ---------- */
function applyLang() {
  updateThemeBtn();
  const u = UI[lang];
  document.documentElement.lang = lang;
  $("title").textContent = u.title;
  $("towerTitle").textContent = u.towerTitle;
  $("phoneTitle").textContent = u.phoneTitle;
  $("candyTitle").textContent = u.candyTitle;
  $("intro").textContent = u.intro;
  $("phoneIntro").textContent = u.phoneIntro;
  $("candyIntro").textContent = u.candyIntro;
  $("speedLabel").textContent = u.speed;
  $("speed-calm").textContent = u.calm;
  $("speed-steady").textContent = u.steady;
  $("speed-fast").textContent = u.fast;
  $("laneBottom").textContent = u.lane;
  $("pauseBtn").textContent = state === "paused" ? u.resume : u.pause;
  $("startBtn").textContent = (state === "over" || state === "won") ? u.againBtn : u.startBtn;
  document.querySelectorAll("[data-lang]").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  document.querySelectorAll("[data-speed]").forEach(b => b.classList.toggle("on", b.dataset.speed === speed));
  $("pkTitle").textContent = u.pkTitle;
  $("pkTowerName").textContent = u.pkTower;
  $("pkTowerDesc").textContent = u.pkTowerDesc;
  $("pkPhoneName").textContent = u.pkPhone;
  $("pkPhoneDesc").textContent = u.pkPhoneDesc;
  $("pkCandyName").textContent = u.pkCandy;
  $("pkCandyDesc").textContent = u.pkCandyDesc;
  $("backFromTower").textContent = u.back;
  $("backFromPhone").textContent = u.back;
  $("backFromCandy").textContent = u.back;
  $("cgSpecTitle").textContent = u.specTitle;
  $("cgSpec1").innerHTML = iconize(u.spec1);
  $("cgSpec2").innerHTML = iconize(u.spec2);
  $("cgSpec3").innerHTML = iconize(u.spec3);
  $("cgSpec4").innerHTML = iconize(u.spec4);
  updateStats(false);
  $("sumReset").textContent = u.reset;
  renderPhone();
  if (selected !== null) showHabit();
  else if (!$("info").textContent) setInfo(u.pickHint);
  if (CG) { placeTiles(); renderCandyPanel(); if (CG.over) hideCandyOv(); }
}

document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; applyLang(); }));
document.querySelectorAll("[data-speed]").forEach(b => b.addEventListener("click", () => { speed = b.dataset.speed; applyLang(); }));
$("startBtn").addEventListener("click", startGame);
$("pauseBtn").addEventListener("click", togglePause);
$("setupBtn").addEventListener("click", buyHabit);
$("faceBtn").addEventListener("click", faceThreat);
$("resetBtn").addEventListener("click", resetPhone);
$("sumReset").addEventListener("click", resetPhone);
document.addEventListener("keydown", e => {
  if ((e.key === "p" || e.key === "P") && state !== "ready" && !$("towerGame").hidden) togglePause();
});

// Sprite of gradients used by every icon, then the chooser icons.
document.body.insertAdjacentHTML("afterbegin", SVG_DEFS);
document.querySelectorAll(".pickIcon").forEach((el, i) => {
  el.innerHTML = svgIcon(["target", "device", "candy"][i]);
});

initTheme();
applyLang();
if (P.ended) showSummary();
showStart();
showGame("picker");
</script>
